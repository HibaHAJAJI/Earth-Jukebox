services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: earth-jukebox-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - earth-jukebox-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earth-jukebox-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - earth-jukebox-network
    restart: unless-stopped

networks:
  earth-jukebox-network:
    driver: bridge
